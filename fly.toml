app = "dante-multimpresos"
primary_region = "gru"

[build]

[env]
  TZ = "America/Argentina/Buenos_Aires"
  DATA_DIR = "/data"
  NODE_ENV = "production"
  MASTRA_HOST = "0.0.0.0"
  TELEGRAM_WEBHOOK_URL = "https://dante-multimpresos.fly.dev/telegram/webhook"

[http_service]
  internal_port = 4111
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health/db"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[mounts]]
  source = "dante_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
